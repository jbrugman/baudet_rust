[workspace]
resolver = "2"
members = ["crates/baudet-core", "crates/baudet-backend", "crates/baudet-app", "crates/baudet-store", "crates/baudet-ui"]

# Versions pinned to what already exists in ~/.cargo/registry/src so the first
# build needs no network: serde 1.0.215, serde_json 1.0.132, tokio 1.41.1,
# futures-util 0.3.31, thiserror 1.0.69.
[workspace.dependencies]
baudet-core = { path = "crates/baudet-core" }
baudet-backend = { path = "crates/baudet-backend" }
baudet-app = { path = "crates/baudet-app" }
baudet-store = { path = "crates/baudet-store" }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.132"
tokio = { version = "=1.41.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "=0.3.31"
thiserror = "=1.0.69"
# Only for the store's fixtures: a real throwaway directory, removed on drop. No network fetch
# is wanted at all, so every version here is one already present in ~/.cargo/registry/src.
tempfile = "3"
# The GUI is the first phase, so the immediate-mode toolkit is a workspace dependency rather than
# a per-crate one: a version skew between the transcript and its renderer is invisible until it
# paints, which is the wrong place to discover it. The version and feature shape follow the
# ArtCraft apps' own UI crate (`storytold/craft-anything`, `crates/ui-egui`), which is egui 0.36
# with eframe's defaults switched off; see ATTRIBUTION.md. What that tree needs is the toolchain
# pinned in rust-toolchain.toml, not a version fight: with 1.95 the whole graph resolves.
#
# `persistence` stays off deliberately. It drags `ron` in for serde of the painter's state, which
# this app does not use: window geometry surviving a restart is not worth the resolver cost, and
# the transcript's own durability belongs to the store layer, not to the window.
eframe = { version = "=0.36", default-features = false }
egui = "=0.36"
egui_extras = { version = "=0.36", default-features = false }
# SVG icons rasterised at the exact on-screen size, which is the reason `svg` is wanted and why
# `image` comes along: ArtCraft rasterises Lucide the same way rather than shipping PNGs per dpi.
resvg = "=0.45"
# A real backend needs an HTTP client and a blocking pool; declared at the workspace so the GUI
# and the transport cannot drift apart on TLS backend choice.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
