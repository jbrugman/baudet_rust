[workspace]
resolver = "2"
members = ["crates/baudet-core", "crates/baudet-backend", "crates/baudet-app", "crates/baudet-ui"]

# Versions pinned to what already exists in ~/.cargo/registry/src so the first
# build needs no network: serde 1.0.215, serde_json 1.0.132, tokio 1.41.1,
# futures-util 0.3.31, thiserror 1.0.69.
[workspace.dependencies]
baudet-core = { path = "crates/baudet-core" }
baudet-backend = { path = "crates/baudet-backend" }
baudet-app = { path = "crates/baudet-app" }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.132"
tokio = { version = "=1.41.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "=0.3.31"
thiserror = "=1.0.69"
# The GUI is the first phase, so the immediate-mode toolkit is a workspace dependency rather than
# a per-crate one: a version skew between the transcript and its renderer is invisible until it
# paints, which is the wrong place to discover it. The version follows ArtCraft's pure-Rust
# desktop app (`storytold/artcraft`, `artcraft-native/`), which is egui on edition 2021.
eframe = { version = "=0.31.1", default-features = false }
egui = "=0.31.1"
egui_extras = { version = "=0.31.1", default-features = false, features = ["image", "svg"] }
# Two downward pins, both forced by this workspace's pinned cargo 1.82, which cannot parse an
# edition 2024 manifest even for a crate it would never compile for this target.
#
#  * `smithay-clipboard` sits behind `cfg(any(linux, *bsd))` in `egui-winit`, which declares the
#    dependency itself, so it cannot be opted out of here. `egui-winit` asks for `^0.7.2`; 0.7.2
#    is edition 2021 and 0.7.3 is edition 2024, so 0.7.2 is the release that resolves. Never
#    compiled on macOS.
#  * `idna` 1.0.3+ delegates to `idna_adapter` (edition 2024). `egui-winit` hard-declares its
#    `links` feature, so `webbrowser` -> `url` -> `idna` is in the graph whatever eframe features
#    are chosen; 1.0.2 is the newest release predating that split.
#
# Neither crate is reachable from a macOS binary, so downgrading costs the product nothing.
# Remove both in the same change as a toolchain bump.
smithay-clipboard = "=0.7.2"
idna = "=1.0.2"
# `persistence` is not wanted: it drags `ron` in, whose current release pins `bitflags` below what
# egui 0.36 requires. Dropping it also drops `serde` support for the painter, which this app does
# not use -- window geometry surviving a restart is not worth a resolver fight it causes on its own.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
