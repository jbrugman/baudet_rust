[workspace]
resolver = "2"
members = ["crates/baudet-core", "crates/baudet-backend", "crates/baudet-app", "crates/baudet-store", "crates/baudet-settings", "crates/baudet-projects", "crates/baudet-tool", "crates/baudet-i18n", "crates/baudet-ui"]

[workspace.dependencies]
baudet-core = { path = "crates/baudet-core" }
baudet-backend = { path = "crates/baudet-backend" }
baudet-app = { path = "crates/baudet-app" }
baudet-store = { path = "crates/baudet-store" }
baudet-settings = { path = "crates/baudet-settings" }
baudet-projects = { path = "crates/baudet-projects" }
baudet-tool = { path = "crates/baudet-tool" }
baudet-i18n = { path = "crates/baudet-i18n" }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.132"
tokio = { version = "=1.41.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "=0.3.31"
thiserror = "=1.0.69"
tempfile = "3"
eframe = { version = "=0.36", default-features = false }
egui = "=0.36"
egui_extras = { version = "=0.36", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"
