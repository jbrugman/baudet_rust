# De tool-laag: wat de assistent mag doen in een projectmap. Geen UI en geen transport — in de
# origineler onderhandelt een tool met de mens uitsluitend via ToolContext, nooit via Swing
# (`tool/Tool.kt`). Die grens is hier dezelfde: deze crate compileert zonder egui.
