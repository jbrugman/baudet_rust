[package]
name = "baudet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
baudet-core = { workspace = true }
baudet-backend = { workspace = true }
baudet-app = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
# No `accesskit`: on macOS eframe reaches the screen through its own objc2 path, and the feature
# only drags in `accesskit_unix` -> `zvariant` for Linux, whose current release is edition 2024.
# Screen-reader support is worth a real design conversation, not a third transitive pin.
eframe = { workspace = true, features = ["default_fonts", "glow"] }
# Pinned so the resolver cannot drift onto an edition 2024 release; see the workspace manifest for
# why each is needed and why neither is ever compiled into a macOS binary.
idna = { workspace = true }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
smithay-clipboard = { workspace = true }
