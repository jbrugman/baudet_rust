[package]
name = "baudet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
baudet-core = { workspace = true }
baudet-backend = { workspace = true }
baudet-app = { workspace = true }
baudet-store = { workspace = true }
baudet-settings = { workspace = true }
baudet-projects = { workspace = true }
baudet-tool = { workspace = true }
baudet-i18n = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }

png = "0.18"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

rfd = { version = "0.18", default-features = false }

arboard = "3.7"
notify = "6.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }


[dev-dependencies]
tempfile = { workspace = true }
