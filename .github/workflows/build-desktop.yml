name: Build desktop packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Baudet-macOS-universal
          path: target/dist/Baudet-macOS-universal.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Baudet-windows-x64
          path: target/dist/Baudet-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev pkg-config libwayland-dev libxkbcommon-dev
      - run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Baudet-Ubuntu-24.04-x64
          path: target/dist/baudet_*_amd64.deb
          if-no-files-found: error
