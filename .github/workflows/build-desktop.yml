name: Build desktop packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'desktop-main-release' || github.run_id }}
  queue: max

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release version
        id: prepare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/release_version.py
      - uses: actions/upload-artifact@v7.0.2
        if: steps.prepare.outputs.version != ''
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          overwrite: true

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: needs.version.outputs.release != ''
        with:
          name: release-manifests
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Baudet-macOS-universal
          path: target/dist/Baudet-macOS-universal.dmg
          if-no-files-found: error
          overwrite: true

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: needs.version.outputs.release != ''
        with:
          name: release-manifests
      - run: pwsh -NoProfile -File packaging/build-windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Baudet-windows-x64
          path: target/dist/Baudet-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  linux:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: needs.version.outputs.release != ''
        with:
          name: release-manifests
      - name: Build and test on Debian Trixie
        # Bubblewrap configures user namespaces and /proc/sys inside the container.
        run: |
          docker run --rm --platform linux/amd64 \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -e CARGO_PROFILE_TEST_DEBUG=0 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/workspace" -w /workspace rust:1.95.0-trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends bubblewrap dpkg-dev pkg-config libwayland-dev libxkbcommon-dev
              bash packaging/build-linux.sh
              cargo test --workspace --locked --no-fail-fast
              BAUDET_WORKSPACE_TEST_SECRET=fixture cargo test --locked -p baudet-tool \
                workspace_enforces_project_permissions_without_command_approval -- --ignored
            '
      - name: Smoke test the package on Debian Trixie
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/target/dist:/packages:ro" debian:trixie bash -euxc '
              apt-get update
              apt-get install -y xvfb xauth libgl1-mesa-dri /packages/baudet_*_amd64.deb
              xvfb-run -a timeout 60s baudet-ui --demo --screenshot=/tmp/baudet.png
              test -s /tmp/baudet.png
            '
      - name: Smoke test the same package on Ubuntu 26.04 LTS
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap xvfb xauth libgl1-mesa-dri ./target/dist/baudet_*_amd64.deb
          screenshot="$RUNNER_TEMP/baudet.png"
          xvfb-run -a timeout 60s baudet-ui --demo --screenshot="$screenshot"
          test -s "$screenshot"
          sudo apt-get install -y libwayland-dev libxkbcommon-dev apparmor-profiles
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [[ ! -f "$profile" ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r "$profile"
          CARGO_TARGET_DIR="$RUNNER_TEMP/baudet-ubuntu-target" BAUDET_WORKSPACE_TEST_SECRET=fixture \
            cargo test --locked -p baudet-tool \
            workspace_enforces_project_permissions_without_command_approval -- --ignored
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Baudet-Linux-amd64
          path: target/dist/baudet_*_amd64.deb
          if-no-files-found: error
          overwrite: true

  release:
    if: needs.version.outputs.release != ''
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.release }}
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-manifests
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Baudet-*
          path: release-assets
          merge-multiple: true
      - name: Tag and publish the desktop packages
        run: bash packaging/publish-release.sh
